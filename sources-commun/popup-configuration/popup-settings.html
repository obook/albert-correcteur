<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Albert Correcteur - Paramètres</title>
  <link rel="stylesheet" href="popup-theme.css">
  <link rel="stylesheet" href="popup-settings.css">
  <script src="popup-theme.js"></script>
</head>
<body>
  <div class="header">
    <a href="#" id="back-btn" class="back" title="Retour">←</a>
    <h1>Paramètres</h1>
  </div>

  <div class="setting">
    <label>Thème de la popup de correction</label>
    <div class="theme-options">
      <label class="theme-option">
        <input type="radio" name="theme" value="dark">
        <span class="theme-preview theme-preview-dark"></span>
        <span>Sombre</span>
      </label>
      <label class="theme-option">
        <input type="radio" name="theme" value="light">
        <span class="theme-preview theme-preview-light"></span>
        <span>Clair</span>
      </label>
      <label class="theme-option">
        <input type="radio" name="theme" value="auto">
        <span class="theme-preview theme-preview-auto"></span>
        <span>Automatique</span>
      </label>
    </div>
  </div>

  <div class="setting">
    <label>Dictionnaire personnel</label>
    <p class="setting-desc">Mots ignorés par le correcteur.</p>
    <div id="ignored-words" class="ignored-words"></div>
    <p id="no-words" class="setting-desc" hidden>Aucun mot ignoré.</p>
  </div>

  <div id="grist-setting" class="setting" hidden>
    <label>Recherche dans une table Grist (à venir)</label>
    <!-- Grisée tant que la déclaration de collecte de données AMO
         (data_collection_permissions) n'est pas revue : l'option envoie
         le contenu d'une table à l'API. -->
    <div class="option-case">
      <input type="checkbox" id="recherche-grist" disabled>
      <label for="recherche-grist">Activer la recherche par le sens</label>
    </div>
    <p class="setting-desc">Sur un document Grist ouvert, la fenêtre de l'extension propose un champ de recherche. Le texte des lignes de la table est envoyé à l'API Albert pour en calculer les vecteurs.</p>
  </div>

  <div id="status" class="status"></div>

  <script src="popup-settings.js"></script>
</body>
</html>
