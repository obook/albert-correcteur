stages:
  - test
  - build
  - sign
  - release
  - update

# ── Tests unitaires (uniquement sur les tags v*) ──

tests:
  stage: test
  image: node:20-alpine
  script:
    - node --version
    - for f in tests/test-*.js; do echo "── $(basename $f) ──" && node "$f"; done
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

# ── Build du .xpi (uniquement sur les tags v*) ──

build:
  stage: build
  image: alpine:latest
  before_script:
    - apk add --no-cache zip
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - XPI_NAME="albert-correcteur_${VERSION}.xpi"
    - mkdir -p .build-firefox
    - cp -r sources/* .build-firefox/
    - cp -r sources-firefox/* .build-firefox/
    - cd .build-firefox
    - zip -r "../${XPI_NAME}" . -x ".*"
    - cd ..
    - rm -rf .build-firefox
    - echo "XPI_NAME=${XPI_NAME}" > build.env
    - echo "VERSION=${VERSION}" >> build.env
    - echo "Extension packagée -> ${XPI_NAME}"
  artifacts:
    paths:
      - "albert-correcteur_*.xpi"
    reports:
      dotenv: build.env
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

# ── Signature Mozilla (uniquement sur les tags v*) ──
# Nécessite les variables CI/CD WEB_EXT_API_KEY et WEB_EXT_API_SECRET (identifiants AMO)
# Si la version existe déjà sur AMO (erreur 409), le .xpi signé est récupéré via l'API.

sign:
  stage: sign
  image: node:20-alpine
  needs:
    - job: build
      artifacts: true
  script:
    - apk add --no-cache curl jq
    - npm install -g web-ext@7.11.0
    - VERSION="${CI_COMMIT_TAG#v}"
    - XPI_NAME="albert-correcteur_${VERSION}.xpi"
    - ADDON_ID="albert-correcteur@ac-bordeaux.fr"
    - mkdir -p .build-firefox
    - cp -r sources/* .build-firefox/
    - cp -r sources-firefox/* .build-firefox/
    - web-ext sign --source-dir=.build-firefox/ --channel=unlisted --api-key="${WEB_EXT_API_KEY}" --api-secret="${WEB_EXT_API_SECRET}" || true
    - rm -rf .build-firefox
    - SIGNED_XPI=$(ls web-ext-artifacts/*.xpi 2>/dev/null || true)
    - |
      if [ -n "$SIGNED_XPI" ]; then
        cp "${SIGNED_XPI}" "${XPI_NAME}"
        echo "Extension signée → ${XPI_NAME}"
      else
        echo "⚠ Pas de .xpi signé en local — récupération depuis AMO…"
        JWT=$(node -e "
          const crypto = require('crypto');
          const h = Buffer.from(JSON.stringify({alg:'HS256',typ:'JWT'})).toString('base64url');
          const now = Math.floor(Date.now()/1000);
          const p = Buffer.from(JSON.stringify({
            iss: process.env.WEB_EXT_API_KEY,
            jti: crypto.randomUUID(),
            iat: now,
            exp: now + 300
          })).toString('base64url');
          const s = crypto.createHmac('sha256', process.env.WEB_EXT_API_SECRET)
            .update(h+'.'+p).digest('base64url');
          console.log(h+'.'+p+'.'+s);
        ")
        ENCODED_ID=$(printf '%s' "$ADDON_ID" | sed 's/@/%40/g')
        DOWNLOAD_URL=$(curl -sf \
          -H "Authorization: JWT ${JWT}" \
          "https://addons.mozilla.org/api/v5/addons/addon/${ENCODED_ID}/versions/?filter=all_with_unlisted" \
          | jq -r --arg v "$VERSION" '.results[] | select(.version == $v) | .file.url // empty')
        if [ -n "$DOWNLOAD_URL" ]; then
          curl -sfL -o "${XPI_NAME}" -H "Authorization: JWT ${JWT}" "${DOWNLOAD_URL}"
          echo "Extension signée récupérée depuis AMO → ${XPI_NAME}"
        else
          echo "ERREUR: impossible de récupérer le .xpi signé depuis AMO" && exit 1
        fi
      fi
    - echo "XPI_NAME=${XPI_NAME}" > build.env
    - echo "VERSION=${VERSION}" >> build.env
  artifacts:
    paths:
      - "albert-correcteur_*.xpi"
    reports:
      dotenv: build.env
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

# ── Release GitForge (uniquement sur les tags v*) ──

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: sign
      artifacts: true
  before_script:
    - apk add --no-cache curl >/dev/null 2>&1 || true
    - |
      RELEASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}"
      HTTP_CODE=$(curl -o /tmp/resp.json -w "%{http_code}" \
        --request DELETE --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${RELEASE_URL}" 2>/dev/null)
      if [ "$HTTP_CODE" = "200" ]; then
        echo "Release existante ${CI_COMMIT_TAG} supprimée"
      elif [ "$HTTP_CODE" = "404" ]; then
        echo "Pas de release existante pour ${CI_COMMIT_TAG}"
      else
        echo "Suppression échouée (HTTP ${HTTP_CODE}) — tentative avec PRIVATE-TOKEN"
        HTTP_CODE=$(curl -o /tmp/resp.json -w "%{http_code}" \
          --request DELETE --header "PRIVATE-TOKEN: ${CI_PUSH_TOKEN}" \
          "${RELEASE_URL}" 2>/dev/null)
        echo "Résultat : HTTP ${HTTP_CODE}"
        cat /tmp/resp.json 2>/dev/null; echo
      fi
  script:
    - echo "Création de la release ${CI_COMMIT_TAG} — ${XPI_NAME}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Albert Correcteur ${CI_COMMIT_TAG}"
    description: "Release ${CI_COMMIT_TAG} — Extension Firefox Albert Correcteur (signée Mozilla)"
    assets:
      links:
        - name: "${XPI_NAME}"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${XPI_NAME}?job=sign"
          link_type: package
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

# ── Mise à jour de updates.json pour les mises à jour automatiques Firefox ──
# Nécessite la variable CI/CD CI_PUSH_TOKEN (token d'accès projet avec scope write_repository)

update-manifest:
  stage: update
  image: alpine:latest
  needs:
    - job: release
  before_script:
    - apk add --no-cache git
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - XPI_URL="${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/albert-correcteur_${VERSION}.xpi?job=sign"
    - git clone "https://oauth2:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" /tmp/repo
    - cd /tmp/repo
    - |
      cat > updates.json << ENDJSON
      {
        "addons": {
          "albert-correcteur@ac-bordeaux.fr": {
            "updates": [
              {
                "version": "${VERSION}",
                "update_link": "${XPI_URL}"
              }
            ]
          }
        }
      }
      ENDJSON
    - git config user.email "ci@albert-correcteur"
    - git config user.name "CI Albert Correcteur"
    - git add updates.json
    - git diff --cached --quiet && echo "updates.json déjà à jour" || (git commit -m "CI — mise à jour updates.json → v${VERSION}" && git push origin main)
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
