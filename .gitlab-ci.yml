stages:
  - test
  - build
  - release

# ── Tests unitaires (uniquement sur les tags v*) ──

tests:
  stage: test
  image: node:20-alpine
  script:
    - node --version
    - for f in tests/test-*.js; do echo "── $(basename $f) ──" && node "$f"; done
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

# ── Build du .xpi (uniquement sur les tags v*) ──

build:
  stage: build
  image: alpine:latest
  before_script:
    - apk add --no-cache zip
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - XPI_NAME="albert-correcteur_${VERSION}.xpi"
    - cd sources
    - zip -r "../${XPI_NAME}" . -x ".*"
    - cd ..
    - echo "XPI_NAME=${XPI_NAME}" > build.env
    - echo "VERSION=${VERSION}" >> build.env
    - echo "Extension packagée → ${XPI_NAME}"
  artifacts:
    paths:
      - "albert-correcteur_*.xpi"
    reports:
      dotenv: build.env
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

# ── Release GitForge (uniquement sur les tags v*) ──

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build
      artifacts: true
  script:
    - echo "Création de la release ${CI_COMMIT_TAG} — ${XPI_NAME}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Albert Correcteur ${CI_COMMIT_TAG}"
    description: "Release ${CI_COMMIT_TAG} — Extension Firefox Albert Correcteur"
    assets:
      links:
        - name: "${XPI_NAME}"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${XPI_NAME}?job=build"
          link_type: package
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
