<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Albert - Traduction</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      background: #1e1e2e;
      color: #e0e0e0;
      padding: 16px;
      min-height: 100vh;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .header h2 {
      font-size: 15px;
      font-weight: 600;
      flex: 1;
    }
    select {
      padding: 4px 8px;
      border: 1px solid #4a4a5a;
      border-radius: 4px;
      background: #272738;
      color: #e0e0e0;
      font-size: 13px;
      font-family: inherit;
    }
    .lang-info {
      font-size: 11px;
      color: #888;
      margin-bottom: 8px;
    }
    .result {
      background: #272738;
      border-radius: 6px;
      padding: 12px;
      line-height: 1.6;
      min-height: 80px;
      user-select: text;
      margin-bottom: 12px;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 16px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }
    button:hover { background: #2563eb; }
    button.secondary {
      background: none;
      border: 1px solid #4a4a5a;
      color: #999;
    }
    button.secondary:hover {
      background: rgba(255,255,255,0.08);
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Traduction</h2>
    <select id="lang" aria-label="Langue cible">
      <option value="fr">Français</option>
      <option value="en">Anglais</option>
      <option value="es">Espagnol</option>
      <option value="de">Allemand</option>
    </select>
  </div>
  <div class="lang-info" id="lang-info"></div>
  <div class="result" id="result">Traduction en cours…</div>
  <div class="actions">
    <button id="copy">Copier</button>
    <button class="secondary" id="close">Fermer</button>
  </div>
  <script src="../util/lang-names.js"></script>
  <script src="message-traduction-popup.js"></script>
</body>
</html>
