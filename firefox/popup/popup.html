<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <img src="../icons/icon.svg" alt="Albert" class="logo">
    <h1>Albert Correcteur</h1>
  </div>

  <form id="config-form">
    <label for="api-key">Clé API Albert</label>
    <input type="password" id="api-key" placeholder="sk-..." autocomplete="off">

    <label for="api-base">URL de l'API</label>
    <input type="url" id="api-base" placeholder="https://albert.api.etalab.gouv.fr">

    <label for="model">Modèle</label>
    <div class="model-row">
      <select id="model">
        <option value="">— Entrez la clé API puis rechargez —</option>
      </select>
      <button type="button" id="refresh-models" title="Recharger les modèles">↻</button>
    </div>

    <button type="submit" id="save-btn">Enregistrer</button>
    <div id="status" class="status"></div>
  </form>

  <div class="footer">
    <a href="https://albert.sites.beta.gouv.fr/" target="_blank">Obtenir une clé API</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
